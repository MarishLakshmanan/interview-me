[project]
name = "interview-me"
version = "0.1.0"
description = "Backend for Interview Me: live voice interviewer, question plan and assessment."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "google-adk>=2.11",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
